<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070B19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070B19;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E879F9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#3B82F6" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-gradient)"/>
  
  <!-- Grid overlay -->
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  
  <!-- Geometric mesh lines -->
  <g opacity="0.15" stroke="#3B82F6" stroke-width="0.5" fill="none">
    <path d="M0,150 Q300,80 600,150 T1200,150"/>
    <path d="M0,180 Q300,110 600,180 T1200,180"/>
    <path d="M0,120 Q300,50 600,120 T1200,120"/>
    <line x1="100" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="350" y2="300"/>
    <line x1="700" y1="0" x2="750" y2="300"/>
    <line x1="1000" y1="0" x2="1050" y2="300"/>
    <line x1="1100" y1="0" x2="1000" y2="300"/>
  </g>
  
  <!-- Accent orbs -->
  <circle cx="150" cy="80" r="60" fill="#3B82F6" opacity="0.04"/>
  <circle cx="1050" cy="220" r="80" fill="#E879F9" opacity="0.03"/>
  <circle cx="600" cy="150" r="120" fill="#3B82F6" opacity="0.02"/>
  
  <!-- Node points -->
  <g filter="url(#soft-glow)">
    <circle cx="180" cy="60" r="2" fill="#3B82F6" opacity="0.7"/>
    <circle cx="320" cy="240" r="1.5" fill="#E879F9" opacity="0.5"/>
    <circle cx="480" cy="45" r="2" fill="#3B82F6" opacity="0.6"/>
    <circle cx="720" cy="260" r="1.5" fill="#3B82F6" opacity="0.5"/>
    <circle cx="900" cy="40" r="2" fill="#E879F9" opacity="0.6"/>
    <circle cx="1020" cy="100" r="1.5" fill="#3B82F6" opacity="0.7"/>
    <circle cx="1100" cy="250" r="2" fill="#E879F9" opacity="0.5"/>
  </g>
  
  <!-- Connection lines between nodes -->
  <g opacity="0.1" stroke="url(#accent-gradient)" stroke-width="0.5" fill="none">
    <line x1="180" y1="60" x2="480" y2="45"/>
    <line x1="480" y1="45" x2="900" y2="40"/>
    <line x1="320" y1="240" x2="720" y2="260"/>
    <line x1="900" y1="40" x2="1020" y2="100"/>
    <line x1="1020" y1="100" x2="1100" y2="250"/>
  </g>
  
  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent-gradient)" opacity="0.8"/>
  
  <!-- Bottom accent line -->
  <rect x="0" y="298" width="1200" height="2" fill="url(#accent-gradient)" opacity="0.4"/>
  
  <!-- Main text -->
  <text x="600" y="130" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="48" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="2" filter="url(#glow)">HASIF ZULKIFLI</text>
  
  <!-- Subtitle -->
  <text x="600" y="175" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#3B82F6" text-anchor="middle" letter-spacing="3" opacity="0.9">AI ARCHITECT</text>
  
  <!-- Separator dots -->
  <circle cx="545" cy="172" r="2" fill="#E879F9" opacity="0.6"/>
  <circle cx="655" cy="172" r="2" fill="#E879F9" opacity="0.6"/>
  
  <!-- Secondary titles -->
  <text x="600" y="210" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="2">EDGE ENGINEER · SYSTEM BUILDER · SOVEREIGN AI</text>
  
  <!-- Status indicator -->
  <g transform="translate(490, 245)">
    <circle cx="0" cy="0" r="4" fill="#22C55E" opacity="0.8"/>
    <circle cx="0" cy="0" r="6" fill="#22C55E" opacity="0.2"/>
    <text x="14" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" letter-spacing="1">SYSTEM ONLINE · MALAYSIA</text>
  </g>
</svg>
